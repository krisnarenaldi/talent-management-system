services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: tms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (Connection Pooling) ──────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tms_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tms_internal

  # ── Redis (arq job queue) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"   # expose ke host untuk dev lokal (arq worker & FastAPI di luar Docker)
    networks:
      - tms_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI (Backend) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms_backend
    restart: unless-stopped
    user: "root"
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - pgbouncer
      - redis
    networks:
      - tms_internal
    volumes:
      - ./backend/uploads:/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Port tidak diekspos langsung — diakses via Nginx

  # ── arq Worker (CV pipeline + cron jobs) ────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms_worker
    restart: unless-stopped
    user: "root"
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: arq app.worker.WorkerSettings
    depends_on:
      - pgbouncer
      - redis
    networks:
      - tms_internal
    volumes:
      - ./backend/uploads:/uploads

  # ── Next.js (Frontend) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tms_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend
    networks:
      - tms_internal
    # Port tidak diekspos langsung — diakses via Nginx

  # ── Nginx (Reverse Proxy) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # SSL certificates (Let's Encrypt)
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - tms_internal

volumes:
  postgres_data:
  redis_data:
  # n8n_data diarsipkan — tidak lagi dipakai (lihat n8n/README.md)

networks:
  tms_internal:
    driver: bridge
