events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upload file size (dokumen CV, KTP, dll)
    client_max_body_size 20M;

    # Upstream services
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }
    upstream n8n      { server n8n:5678; }

    # ── HTTP → HTTPS redirect ──────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name your-domain.com;  # Ganti dengan domain aktual

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security model:
        # - /api/v1/internal/*  → blocked from public internet (hanya n8n → backend, antar-container)
        # - /api/*              → FastAPI backend
        # - /*                  → Next.js frontend

        # ── BLOKIR akses endpoint internal dari luar ──
        # Endpoint /api/v1/internal/* hanya boleh dipanggil dari dalam container (n8n → backend).
        # Nginx memilih location paling spesifik (longest prefix match), sehingga blok ini
        # menang atas /api/ di bawah meskipun letaknya setelahnya.
        location /api/v1/internal/ {
            deny all;
            return 403;
        }

        # ── FastAPI Backend ──
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── n8n UI — hanya bisa diakses dari IP tertentu atau via VPN ──
        # Hapus/edit blok ini sesuai kebutuhan
        location /n8n/ {
            proxy_pass         http://n8n/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            # Contoh restrict ke IP tertentu:
            # allow 123.123.123.123;
            # deny all;
        }

        # ── Next.js Frontend ──
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support (Next.js hot reload di dev)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
